<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Madam Jee ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

    <!-- Boot Screen -->

    <div id="boot">

        <h1>LOVE OS v2.0</h1>

        <div id="terminal"></div>

    </div>

    <!-- Main Page -->

    <div id="main" style="display:none;">

        <img src="assets/madam.jpg.jpeg" class="photo">

        <h1>Dear Madam Jee ❤️</h1>

        <p id="typing"></p>

        <div class="buttons">

            <button id="yes">❤️ YES ❤️</button>

            <button id="no">🙈 NO</button>

        </div>

    </div>

    <!-- Floating Hearts -->

    <div id="hearts"></div>

    <!-- Final Popup -->

    <div id="popup">

        <div class="popup-box">

            <h2>💖 Ahmad Raza 💖</h2>

            <p>

                Madam Jee ❤️<br><br>

                I don't promise a perfect life...<br>

                But I promise to always respect you,<br>

                support you and stay beside you.<br><br>

                Will you make me the happiest person<br>

                by saying <b>YES?</b> 💍❤️

            </p>

            <button id="closePopup">❤️ Forever ❤️</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
